[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.4.0"
description = "Deterministic CASCADE benchmark and traceable Phase 2.3 simulation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
cascade-sim = "src.simulation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

